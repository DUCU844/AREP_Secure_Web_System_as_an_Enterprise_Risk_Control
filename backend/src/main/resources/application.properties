spring.application.name=arep-enterprise-risk-api
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}

# Auth0 issuer must include https:// and the final slash.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:https://dev-fn3v0pak3325bn1p.us.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://arep-enterprise-risk-api}

# Comma-separated exact browser origins. Never use * in production.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
